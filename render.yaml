services:
  - type: web
    name: black-rock-api
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: POLLINATIONS_API_KEY
        sync: false
    domains:
      - your-render-domain.onrender.com